name: Build and release

# Pull requests: build the universal app and attach it as a workflow artifact, to check it compiles.
# Tags like v0.1.0: same build, then publish a GitHub release with FlexBar.zip.
on:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          ./build.sh --release
          lipo -info build/FlexBar.app/Contents/MacOS/FlexBar

      - uses: actions/upload-artifact@v4
        with:
          name: FlexBar
          path: build/FlexBar.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/FlexBar.zip \
            --title "FlexBar $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Download **FlexBar.zip**, unzip it and drag FlexBar to Applications. The app isn't signed by Apple, so the first launch needs one extra step: see [Install](https://github.com/${{ github.repository }}#install) in the README."
